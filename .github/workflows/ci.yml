name: CI

# Skip the coding pipeline for doc-only changes: editing markdown or docs
# should not trigger ruff/mypy/pytest. A commit that
# touches any non-doc file still runs the full pipeline.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE-*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE-*'
      - '.gitignore'

jobs:
  # Authoritative gate: tests MUST pass. Runs independently of lint/type checks
  # so a lint failure can never mask the test result.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run tests
        run: |
          pytest tests/ -v --cov=qpdk --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Non-blocking: there is pre-existing ruff/mypy debt across the codebase that
  # is being paid down separately. These steps report findings in the logs but
  # do NOT gate merges (continue-on-error). Flip these to blocking once the debt
  # is cleared.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check qpdk/

      - name: Type check with mypy
        continue-on-error: true
        run: mypy qpdk/ --ignore-missing-imports

  validate-examples:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QPDK
        run: |
          pip install -e .

      - name: Validate good plugins
        run: |
          for plugin in examples/good/*.qplug; do
            echo "Validating $plugin"
            qpdk validate "$plugin" --format json
          done

      # Designer drag-in evaluation: good examples must survive design-time
      # execution (Controls nil). Exit 1 = a good example would crash Designer.
      - name: Design-check good plugins
        run: |
          shopt -s nullglob
          plugins=(examples/good/*.qplug)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "ERROR: no good examples matched - gate asserted nothing"
            exit 1
          fi
          qpdk design-check "${plugins[@]}"

      # QSC's official evaluator: good examples must pass it too, so the
      # showcase plugin never drifts from the official SDK vocabulary.
      - name: QSC evaluator on good plugins
        run: |
          shopt -s nullglob
          plugins=(examples/good/*.qplug)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "ERROR: no good examples matched - gate asserted nothing"
            exit 1
          fi
          qpdk qsc-eval "${plugins[@]}"

      # These fixtures are INTENTIONALLY invalid: the gate asserts the
      # validator still catches them. A bad example that validates clean is a
      # validator regression and must fail CI. --strict is required because
      # local-timer.qplug only carries WARNING-level issues (exit 2 under
      # --strict, exit 0 without).
      - name: Validate bad plugins (must be caught)
        run: |
          # (a) zero matched examples = gate asserted nothing -> fail;
          # (b) non-zero exit alone is not proof of rejection (usage errors also
          #     exit 2) -> output must contain QPDK rule findings.
          shopt -s nullglob
          plugins=(examples/bad/*.qplug)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "ERROR: no bad examples matched examples/bad/*.qplug - gate asserted nothing"
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            echo "Validating $plugin (expecting issues)"
            set +e
            out=$(qpdk validate "$plugin" --strict 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ERROR: $plugin is an intentionally-bad example but validated clean"
              exit 1
            fi
            if ! echo "$out" | grep -q "QPDK"; then
              echo "ERROR: validator produced no QPDK findings for $plugin (crash or usage error, rc=$rc):"
              echo "$out"
              exit 1
            fi
          done
